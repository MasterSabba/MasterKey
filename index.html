<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Key - Multiverse Edition</title>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- Stile dinamico per la porta d'uscita -->
    <style id="door-style">
        .grid::after { top: 100px; height: 50px; }
    </style>

    <style>
        :root {
            --bg: #0f1710;
            --wood: #b8860b;
            --wood-dark: #2a1a08;
            --gold: #ffd700;
            --board-border: #8b5a2b;
            --board-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(139, 90, 43, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            color: #f0e6d2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            transition: background 0.8s ease;
            position: relative;
        }

        /* TEMI SFONDI MONDI */
        body.world-1 {
            --bg: #0b140d; --wood: #a07246; --wood-dark: #2c1a0e; --gold: #f3c623; --board-border: #5c3a21;
            --board-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 25px rgba(46, 125, 50, 0.3);
            background: radial-gradient(circle at 50% 30%, #1e3822 0%, #0d1e11 50%, #050b06 100%);
        }
        body.world-2 {
            --bg: #030814; --wood: #00d4ff; --wood-dark: #021329; --gold: #00ffcc; --board-border: #00d4ff;
            --board-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 30px rgba(0, 212, 255, 0.5);
            background: radial-gradient(circle at 50% 40%, #08214d 0%, #030d24 60%, #01040a 100%);
        }
        body.world-3 {
            --bg: #140302; --wood: #ff4500; --wood-dark: #2b0602; --gold: #ffcc00; --board-border: #ff3300;
            --board-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 30px rgba(255, 69, 0, 0.6);
            background: radial-gradient(circle at 50% 70%, #4a0d05 0%, #210402 50%, #0a0101 100%);
        }
        body.world-4 {
            --bg: #011627; --wood: #4cc9f0; --wood-dark: #0f2b46; --gold: #72efdd; --board-border: #4cc9f0;
            --board-shadow: 0 0 25px #4cc9f0;
            background: radial-gradient(circle at 50% 50%, #1d4e89 0%, #0f2b46 60%, #011627 100%);
        }
        body.world-5 {
            --bg: #1c0c04; --wood: #d97706; --wood-dark: #271203; --gold: #fbbf24; --board-border: #b45309;
            --board-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 25px rgba(245, 158, 11, 0.4);
            background: radial-gradient(circle at 50% 30%, #78350f 0%, #291003 50%, #0d0401 100%);
        }
        body.world-6 {
            --bg: #0b1329; --wood: #38bdf8; --wood-dark: #0f172a; --gold: #facc15; --board-border: #38bdf8;
            --board-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 60%, #050b14 100%);
        }
        body.world-7 {
            --bg: #05050a; --wood: #6b21a8; --wood-dark: #180e29; --gold: #a855f7; --board-border: #6b21a8;
            --board-shadow: 0 0 25px #6b21a8;
            background: radial-gradient(circle at 50% 50%, #3b0764 0%, #180e29 60%, #05050a 100%);
        }
        body.world-8 {
            --bg: #021202; --wood: #10b981; --wood-dark: #022c14; --gold: #34d399; --board-border: #10b981;
            --board-shadow: 0 0 25px #10b981;
            background: radial-gradient(circle at 50% 50%, #064e3b 0%, #022c14 60%, #021202 100%);
        }
        body.world-9 {
            --bg: #1c0505; --wood: #e11d48; --wood-dark: #3f0713; --gold: #fb7185; --board-border: #e11d48;
            --board-shadow: 0 0 25px #e11d48;
            background: radial-gradient(circle at 50% 50%, #881337 0%, #3f0713 60%, #1c0505 100%);
        }
        body.world-10 {
            --bg: #090014; --wood: #8b5cf6; --wood-dark: #2e1065; --gold: #c084fc; --board-border: #8b5cf6;
            --board-shadow: 0 0 30px #c084fc;
            background: radial-gradient(circle at 50% 50%, #4c1d95 0%, #2e1065 60%, #090014 100%);
        }

        .bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; overflow: hidden; transition: opacity 0.8s ease; opacity: 0;
        }

        body.world-1 #bg-forest,
        body.world-2 #bg-neon,
        body.world-3 #bg-volcano { opacity: 1; }

        .trees-svg { position: absolute; bottom: 0; width: 100%; height: 45vh; fill: #061008; opacity: 0.85; }

        canvas#particles-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

        .cyber-grid {
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: 
                linear-gradient(to right, rgba(0, 212, 255, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 212, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px; transform: perspective(500px) rotateX(60deg); animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
        }

        .lava-glow {
            position: absolute; bottom: -100px; left: 50%; transform: translateX(-50%);
            width: 120vw; height: 350px;
            background: radial-gradient(ellipse at center, rgba(255, 69, 0, 0.4) 0%, rgba(255, 0, 0, 0.15) 50%, transparent 80%);
            animation: lavaPulse 4s ease-in-out infinite alternate;
        }

        @keyframes lavaPulse {
            0% { opacity: 0.6; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        #popup-notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 15, 30, 0.95); border: 2px solid var(--gold); color: #fff;
            padding: 12px 24px; border-radius: 12px; font-weight: bold; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; text-align: center; max-width: 90%;
        }
        #popup-notification.show { transform: translateX(-50%) translateY(0); }

        .exit-button {
            position: absolute; top: 15px; left: 20px; font-size: 2rem; line-height: 1;
            color: rgba(255, 255, 255, 0.6); text-decoration: none; z-index: 100;
            transition: all 0.2s ease; font-family: Arial, sans-serif; cursor: pointer;
        }
        .exit-button:hover { color: var(--gold); transform: scale(1.1); }

        #game-ui { 
            position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px;
            backdrop-filter: blur(5px); padding: 15px; border-radius: 20px; background: rgba(0, 0, 0, 0.35);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .header { 
            display: flex; gap: 20px; background: var(--wood-dark); padding: 10px 22px; 
            border-radius: 15px; border: 2px solid var(--wood); align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .stat-item { font-weight: bold; color: var(--gold); font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
        .btn-menu-top { 
            background: var(--gold); color: #000; border: none; font-weight: bold; 
            border-radius: 8px; cursor: pointer; padding: 7px 14px; transition: transform 0.2s;
        }
        .btn-menu-top:hover { transform: scale(1.05); }

        .world-badge {
            font-size: 0.85rem; letter-spacing: 1px; padding: 4px 12px; background: rgba(0, 0, 0, 0.5);
            border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; text-transform: uppercase;
        }

        .level-tag { color: var(--gold); font-weight: bold; font-size: 1.3rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        .board-frame { 
            padding: 14px; background: var(--wood-dark); border-radius: 18px; 
            border: 4px solid var(--board-border); box-shadow: var(--board-shadow); transition: all 0.3s ease; position: relative;
        }

        .grid { width: 300px; height: 300px; position: relative; background: rgba(0, 0, 0, 0.85); border-radius: 10px; overflow: visible; }

        .grid::after {
            content: ''; position: absolute; right: -18px; width: 20px; 
            background: var(--gold); border-radius: 0 8px 8px 0; box-shadow: 0 0 15px var(--gold); z-index: 5;
        }

        .block {
            position: absolute; border-radius: 8px; box-sizing: border-box; border: 2px solid rgba(0,0,0,0.4);
            background: var(--wood); cursor: grab; box-shadow: inset 0 0 12px rgba(255,255,255,0.25), 0 4px 8px rgba(0,0,0,0.5);
            touch-action: none; display: flex; justify-content: center; align-items: center; font-size: 14px;
            transition: transform 0.08s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .block.dragging { transition: none !important; z-index: 20; }
        
        /* Animazione d'uscita fluida e trionfante della chiave */
        .block-key { 
            background: var(--gold) !important; z-index: 10; border-color: #fff;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 0 15px var(--gold);
        }
        .block-key.escaping {
            transition: left 0.45s cubic-bezier(0.25, 1, 0.5, 1), transform 0.45s ease-in, filter 0.45s ease !important;
            filter: drop-shadow(0 0 20px #ffd700) brightness(1.3);
            transform: scale(1.05) rotate(5deg);
            z-index: 30;
        }

        .block-obstacle { background: #222 !important; border-color: #ff3300 !important; cursor: not-allowed; box-shadow: inset 0 0 10px #ff0000; }

        .fog-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; opacity: 0.92; pointer-events: none; transition: opacity 0.3s; z-index: 8; }

        .footer-controls { display: flex; gap: 10px; margin-top: 5px; }

        .btn-wood {
            padding: 12px 22px; background: var(--wood-dark); color: white; border: 1px solid var(--wood);
            border-radius: 10px; font-weight: bold; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn-wood:hover { transform: translateY(-2px); }
        .btn-wood.gold { background: var(--gold); color: #000; }
        .btn-wood.skin { background: #000; color: var(--gold); border: 1px solid var(--gold); }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; }
        .modal { background: var(--wood-dark); padding: 25px; border-radius: 20px; border: 3px solid var(--wood); text-align: center; width: 88%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }

        .world-tabs { display: flex; gap: 4px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { padding: 6px 10px; background: #000; color: #aaa; border: 1px solid var(--wood); border-radius: 6px; cursor: pointer; font-size: 0.75rem; white-space: nowrap; font-weight: bold; }
        .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }

        .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; max-height: 200px; overflow-y: auto; padding: 5px; }
        .lvl-btn { aspect-ratio: 1; background: rgba(0,0,0,0.6); color: var(--gold); border: 2px solid var(--wood); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .lvl-btn.locked { opacity: 0.3; cursor: not-allowed; }
        .lvl-btn.completed { border-color: var(--gold); background: rgba(255, 215, 0, 0.2); }

        .world-complete-title {
            font-size: 1.8rem !important;
            color: #ffd700 !important;
            text-shadow: 0 0 15px #ffd700, 0 4px 10px #000;
            animation: pulseTitle 1.5s infinite alternate;
        }
        @keyframes pulseTitle {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
    </style>
</head>
<body class="world-1">

    <a href="#" onclick="window.close(); return false;" class="exit-button" title="Torna all'Hub">×</a>

            <div class="victory-btns" id="victory-buttons-container" style="display: flex; gap: 8px; justify-content: center;">
                <button class="btn-wood" onclick="toggleMenu()">MONDI</button>
                <button class="btn-wood gold" onclick="nextLevel()">AVANTI</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBxZQF5OO5-znaipaPYeFcjOARjFXO1_gc",
            authDomain: "mastersabba-games.firebaseapp.com",
            databaseURL: "https://mastersabba-games-default-rtdb.firebaseio.com",
            projectId: "mastersabba-games",
            storageBucket: "mastersabba-games.firebasestorage.app",
            messagingSenderId: "254141019232",
            appId: "1:254141019232:web:29702c03b91f8a76677f05",
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get('userId');
        const playerParam = urlParams.get('player');

        if (!userId || userId === 'guest') {
            userId = localStorage.getItem('masterhub_logged_user');
        }

        let userNick = playerParam || localStorage.getItem('nickname') || localStorage.getItem('username') || "Player";

        let gridSize = 6;
        let cellSize = 50;
        let blocks = [], initialPos = [], isDragging = false, timerInterval, seconds = 0;

        let level = parseInt(localStorage.getItem('mk_level')) || 1;
        let unlockedLevel = parseInt(localStorage.getItem('mk_unlocked')) || 1;
        let xp = parseInt(localStorage.getItem("points_masterkey")) || parseInt(localStorage.getItem('mk_xp')) || 0;
        localStorage.setItem('points_masterkey', xp);

        let rewardedLevels = JSON.parse(localStorage.getItem('mk_rewarded')) || [];
        let skipCost = parseInt(localStorage.getItem('mk_skip_cost')) || 500;
        let activeTabWorld = 1;

        // TITOLI DEI MONDI MIGLIORATI E TEMATICI
        const worldNames = [
            "La Foresta Ancestrale", "La Cripta Neon", "Il Vulcano Magmatico", "L'Abisso Cristallizzato", 
            "Il Deserto Dorato", "Il Laboratorio Quantico", "Il Regno del Crepuscolo", "La Cyber Matrix", 
            "La Cattedrale del Caos", "La Singolarità Cosmica", "Le Rovine Celeste", "I Giardini di Vetro", 
            "La Fucina Temporale", "L'Oasi Stellare", "Il Labirinto Sussurrato", "La Cittadella di Ferro", 
            "I Portali Etere", "Il Tempio del Vuoto", "La Valle dei Sussurri", "Il Nexus Dimensionale"
        ];

        const worldConfig = {};
        const currencies = ["🪵", "💎", "🔥", "❄️", "🏜️", "⚙️", "👁️", "⚡", "🔮", "🌟", "🔋", "🛸", "☀️", "🧊", "🌴", "🧲", "🌙", "⏱️", "🌀", "🛡️"];

        for (let w = 1; w <= 100; w++) {
            let cur = currencies[(w - 1) % currencies.length];
            let baseName = worldNames[(w - 1) % worldNames.length];
            let name = w === 100 ? `Mondo ${w} ${cur}: Fine del Multiverso` : `Mondo ${w} ${cur}: ${baseName}`;
            worldConfig[w] = { name: name, cur: cur };
        }

        function syncAndUnlockPreviousWorlds() {
            if (level > 1) {
                unlockedLevel = Math.max(unlockedLevel, level);
                localStorage.setItem('mk_unlocked', unlockedLevel);
                
                let updated = false;
                for (let i = 1; i < level; i++) {
                    if (!rewardedLevels.includes(i)) {
                        rewardedLevels.push(i);
                        updated = true;
                    }
                }
                if (updated) {
                    localStorage.setItem('mk_rewarded', JSON.stringify(rewardedLevels));
                }
            }
        }

        function configureWorldSettings(worldNum) {
            const body = document.body;
            body.className = '';
            let themeClass = 'world-' + (((worldNum - 1) % 10) + 1);
            body.classList.add(themeClass);

            const info = worldConfig[worldNum] || worldConfig[1];
            document.getElementById("world-title").innerText = info.name;

            const iconEl = document.getElementById("currency-icon");
            if (iconEl) iconEl.innerText = info.cur;

            if (worldNum % 10 === 0 || worldNum === 100) gridSize = 9;
            else gridSize = 6;

            cellSize = 300 / gridSize;

            const doorStyle = document.getElementById('door-style');
            if (doorStyle) {
                const keyY = (worldNum % 10 === 0 || worldNum === 100) ? Math.floor(gridSize / 2) : 2;
                let topPos = keyY * cellSize;
                doorStyle.innerHTML = `.grid::after { top: ${topPos}px !important; height: ${cellSize}px !important; }`;
            }

            const fogEl = document.getElementById("fog");
            if (fogEl) fogEl.style.display = (worldNum % 10 === 7) ? "block" : "none";

            initParticles();
        }

        function showPopup(message) {
            const popup = document.getElementById('popup-notification');
            popup.innerText = message;
            popup.classList.add('show');
            setTimeout(() => { popup.classList.remove('show'); }, 3000);
        }

        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.color = `rgba(255, 255, 255, ${Math.random() * 0.7 + 0.2})`;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = this.color; ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 40; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        window.onload = () => {
            checkUrlLevelOverride();
            const currentUserId = userId || localStorage.getItem('masterhub_logged_user');

            const bootGame = (targetLevel) => {
                level = parseInt(targetLevel) || 1;
                syncAndUnlockPreviousWorlds();

                updateUI();
                loadLevel(level);
                initParticles();
                animateParticles();
            };

            if (currentUserId && currentUserId !== 'guest' && typeof db !== 'undefined' && db !== null) {
                db.ref('users/' + currentUserId + '/winsPerGame').once('value').then((snapshot) => {
                    if (snapshot.exists()) {
                        const winsData = snapshot.val();
                        let cloudLevel = null;
                        
                        for (let key in winsData) {
                            let cleanKey = key.toLowerCase().replace(/[\s_-]/g, '');
                            if (cleanKey.includes('freethekey') || cleanKey.includes('masterkey')) {
                                cloudLevel = winsData[key];
                                break;
                            }
                        }
                        
                        if (cloudLevel !== null && cloudLevel > 1) {
                            bootGame(cloudLevel);
                        } else {
                            bootGame(parseInt(localStorage.getItem('mk_level')) || 1);
                        }
                    } else {
                        bootGame(parseInt(localStorage.getItem('mk_level')) || 1);
                    }
                }).catch(() => {
                    bootGame(parseInt(localStorage.getItem('mk_level')) || 1);
                });
            } else {
                bootGame(parseInt(localStorage.getItem('mk_level')) || 1);
            }
        };

        function checkUrlLevelOverride() {
            const paramLevel = urlParams.get('level');
            if (paramLevel && !isNaN(paramLevel)) {
                let pLvl = parseInt(paramLevel, 10);
                level = pLvl;
                localStorage.setItem("mk_level", pLvl);
            }
        }

        function getCurrentWorld(lvl) {
            return Math.min(100, Math.floor((lvl - 1) / 100) + 1);
        }

        function isWorldCompleted(worldNum) {
            let startLvl = (worldNum - 1) * 100 + 1;
            let endLvl = worldNum * 100;
            for (let i = startLvl; i <= endLvl; i++) {
                if (!rewardedLevels.includes(i)) return false;
            }
            return true;
        }

        async function savePoints(newXp) {
            xp = newXp;
            localStorage.setItem('points_masterkey', xp);
            localStorage.setItem('mk_xp', xp);
            updateUI();

            if (userId && userId !== 'guest' && db) {
                await db.ref('users/' + userId).update({
                    xp: xp,
                    winsPerGame: {
                        ...((await db.ref('users/' + userId + '/winsPerGame').once('value')).val() || {}),
                        "Free the Key": level
                    }
                });
            }
        }

        function triggerGameWin(pointsGained) {
            const target = window.opener || (window.parent !== window ? window.parent : null);
            if (target) {
                target.postMessage({ gameKey: 'master-key', points: pointsGained }, '*');
            }
        }

        function canMoveTo(x, y, l, o, idx, currentBlocks) {
            const w = o === 'h' ? l : 1, h = o === 'v' ? l : 1;
            if (x < 0 || x + w > gridSize || y < 0 || y + h > gridSize) return false;
            return !currentBlocks.some((b, i) => {
                if (i === idx) return false;
                const bw = b.o === 'h' ? b.l : 1, bh = b.o === 'v' ? b.l : 1;
                return x < b.x + bw && x + w > b.x && y < b.y + bh && y + h > b.y;
            });
        }

        function isSolvable(startBlocks, worldNum) {
            let queue = [JSON.stringify(startBlocks)];
            let visited = new Set([queue[0]]);
            let steps = 0;
            let winX = gridSize - 2;

            while (queue.length > 0 && steps < 1000) {
                steps++;
                let currentBlocks = JSON.parse(queue.shift());
                if (currentBlocks[0].x >= winX) return true;

                for (let i = 0; i < currentBlocks.length; i++) {
                    let b = currentBlocks[i];
                    if (b.obs) continue;

                    let dirs = b.o === 'h' ? [[1,0], [-1,0]] : [[0,1], [0,-1]];
                    for (let d of dirs) {
                        let next = JSON.parse(JSON.stringify(currentBlocks));
                        let nb = next[i];
                        while (true) {
                            let nx = nb.x + d[0], ny = nb.y + d[1];
                            if (canMoveTo(nx, ny, nb.l, nb.o, i, next)) {
                                nb.x = nx; nb.y = ny;
                                let state = JSON.stringify(next);
                                if (!visited.has(state)) { visited.add(state); queue.push(state); }
                            } else break;
                        }
                    }
                }
            }
            return false;
        }

        function generateHardLevel(num) {
            const curWorld = getCurrentWorld(num);
            configureWorldSettings(curWorld);

            let solved = false;
            let attempts = 0;
            let seed = num * 1234.5;
            const rng = () => {
                seed = Math.sin(seed) * 10000;
                return seed - Math.floor(seed);
            };

            const keyY = (curWorld % 10 === 0 || curWorld === 100) ? Math.floor(gridSize / 2) : 2;

            while (!solved && attempts < 250) {
                attempts++;
                blocks = [{ x: 0, y: keyY, l: 2, o: 'h', k: true, obs: false }];

                if (curWorld % 10 === 3) {
                    let ox = Math.floor(gridSize / 2), oy = (keyY + 1) % gridSize;
                    blocks.push({ x: ox, y: oy, l: 1, o: 'h', k: false, obs: true });
                }

                let targetCount = (curWorld % 10 === 0 || curWorld === 100) ? 10 : (6 + Math.min(Math.floor((num % 100) / 5), 4));

                for (let i = 0; i < 150 && blocks.length < targetCount; i++) {
                    let l = rng() > 0.75 ? 3 : 2;
                    let o = rng() > 0.5 ? 'h' : 'v';
                    let x = Math.floor(rng() * (gridSize - (o === 'h' ? l : 1)));
                    let y = Math.floor(rng() * (gridSize - (o === 'v' ? l : 1)));
                    if (o === 'h' && y === keyY) continue; 
                    if (!checkCollision(x, y, l, o, -1)) blocks.push({ x, y, l, o, k: false, obs: false });
                }

                if (isSolvable(JSON.parse(JSON.stringify(blocks)), curWorld % 10)) {
                    solved = true;
                } else {
                    seed += 1.5;
                }
            }

            if (!solved) {
                blocks = [{ x: 0, y: keyY, l: 2, o: 'h', k: true, obs: false }, { x: 3, y: (keyY === 0 ? 1 : 0), l: 2, o: 'v', k: false, obs: false }];
            }

            initialPos = JSON.parse(JSON.stringify(blocks));
        }

        function checkCollision(x, y, l, o, idx) {
            const w = o === 'h' ? l : 1, h = o === 'v' ? l : 1;
            if (x < 0 || x + w > gridSize || y < 0 || y + h > gridSize) return true;
            return blocks.some((b, i) => {
                if (i === idx) return false;
                const bw = b.o === 'h' ? b.l : 1, bh = b.o === 'v' ? b.l : 1;
                return x < b.x + bw && x + w > b.x && y < b.y + bh && y + h > b.y;
            });
        }

        function render() {
            const grid = document.getElementById("grid");
            grid.innerHTML = '';
            const curWorld = getCurrentWorld(level);

            blocks.forEach((b, i) => {
                const div = document.createElement("div");
                div.className = `block ${b.k ? 'block-key' : ''} ${b.obs ? 'block-obstacle' : ''}`;
                div.style.width = (b.o === 'h' ? b.l * cellSize : cellSize) - 4 + "px";
                div.style.height = (b.o === 'v' ? b.l * cellSize : cellSize) - 4 + "px";
                div.style.left = (b.x * cellSize + 2) + "px";
                div.style.top = (b.y * cellSize + 2) + "px";

                if (b.obs) div.innerHTML = "⚙️";
                if (b.obs) { grid.appendChild(div); return; }

                div.onpointerdown = (e) => {
                    if (isDragging) return;
                    isDragging = true;
                    div.classList.add('dragging');
                    div.setPointerCapture(e.pointerId);
                    let startX = e.clientX, startY = e.clientY, ox = b.x, oy = b.y;

                    div.onpointermove = (em) => {
                        let dx = Math.round((em.clientX - startX) / cellSize);
                        let dy = Math.round((em.clientY - startY) / cellSize);
                        let target = (b.o === 'h' ? ox + dx : oy + dy);
                        let current = (b.o === 'h' ? b.x : b.y);

                        while (current !== target) {
                            let step = target > current ? 1 : -1;
                            let nx = b.x + (b.o === 'h' ? step : 0), ny = b.y + (b.o === 'v' ? step : 0);
                            
                            if (!checkCollision(nx, ny, b.l, b.o, i)) {
                                b.x = nx; b.y = ny; current += step;
                                if (curWorld % 10 === 4) {
                                    while (!checkCollision(b.x + (b.o === 'h' ? step : 0), b.y + (b.o === 'v' ? step : 0), b.l, b.o, i)) {
                                        b.x += (b.o === 'h' ? step : 0); b.y += (b.o === 'v' ? step : 0);
                                    }
                                }
                            } else break;
                        }
                        div.style.left = (b.x * cellSize + 2) + "px";
                        div.style.top = (b.y * cellSize + 2) + "px";

                        if (curWorld % 10 === 7 && b.k) {
                            const fog = document.getElementById("fog");
                            if (fog) fog.style.opacity = Math.max(0.2, 0.9 - (b.x / gridSize));
                        }
                    };

                    div.onpointerup = () => {
                        isDragging = false; 
                        div.classList.remove('dragging');
                        div.onpointermove = null;
                        let winX = gridSize - 2;
                        if (b.k && b.x >= winX) handleWin();
                    };
                };
                grid.appendChild(div);
            });
        }

        // ANIMAZIONE TRIONFANTE DELLA CHIAVE VERSO L'USCITA
        function handleWin() {
            clearInterval(timerInterval);
            const keyElement = document.querySelector('.block-key');
            
            if (keyElement) {
                keyElement.classList.add('escaping');
                keyElement.style.left = (gridSize * cellSize + 20) + "px";
            }

            setTimeout(() => {
                let msg = "GIÀ FATTO";
                let curWorld = getCurrentWorld(level);
                let currencySymbol = worldConfig[curWorld]?.cur || '💎';
                const fixedPoints = 100;

                let newXp = xp;
                if (!rewardedLevels.includes(level)) {
                    newXp += fixedPoints;
                    rewardedLevels.push(level);
                    localStorage.setItem('mk_rewarded', JSON.stringify(rewardedLevels));
                    triggerGameWin(fixedPoints);
                    msg = `+${fixedPoints} ${currencySymbol}`;
                }

                let wasLastLevelOfWorld = (level % 100 === 0);

                if (level >= unlockedLevel) { 
                    unlockedLevel = level + 1;
                    localStorage.setItem('mk_unlocked', unlockedLevel); 
                }

                savePoints(newXp);

                const winTitleEl = document.getElementById("win-title");

                if (level >= 10000) {
                    winTitleEl.className = "world-complete-title";
                    winTitleEl.innerText = "👑 FINE DEL MULTIVERSO!";
                    document.getElementById("victory-xp-msg").innerHTML = "Hai superato tutti i 100 Mondi!<br><b>Prossimi mondi in arrivo a breve!</b>";
                    document.getElementById("victory-buttons-container").innerHTML = `<button class="btn-wood gold" onclick="toggleMenu()">MONDI</button>`;
                } else if (wasLastLevelOfWorld) {
                    let startLvl = (curWorld - 1) * 100 + 1;
                    let endLvl = curWorld * 100;
                    let missingLevels = false;
                    for (let i = startLvl; i < endLvl; i++) {
                        if (!rewardedLevels.includes(i)) {
                            missingLevels = true;
                            break;
                        }
                    }

                    if (missingLevels) {
                        winTitleEl.className = "";
                        winTitleEl.innerText = `Mondo ${curWorld}: Livello completato`;
                        document.getElementById("victory-xp-msg").innerHTML = `⚠️ <b>Mondo non completato!</b><br>Devi prima finire tutti i livelli precedenti di questo mondo per sbloccarlo!`;
                        document.getElementById("victory-buttons-container").innerHTML = `
                            <button class="btn-wood" onclick="toggleMenu()">MONDI</button>
                        `;
                    } else {
                        winTitleEl.className = "world-complete-title";
                        winTitleEl.innerText = `MONDO ${curWorld} COMPLETATO 🎉`;
                        document.getElementById("victory-xp-msg").innerHTML = `Sbloccato il Mondo ${curWorld + 1}!<br>${msg}`;
                        document.getElementById("victory-buttons-container").innerHTML = `
                            <button class="btn-wood" onclick="toggleMenu()">MONDI</button>
                            <button class="btn-wood gold" onclick="nextLevel()">AVANTI</button>
                        `;
                    }
                } else {
                    winTitleEl.className = "";
                    winTitleEl.innerText = `Mondo ${curWorld}: Livello completato`;
                    document.getElementById("victory-xp-msg").innerHTML = msg;
                    document.getElementById("victory-buttons-container").innerHTML = `
                        <button class="btn-wood" onclick="toggleMenu()">MONDI</button>
                        <button class="btn-wood gold" onclick="nextLevel()">AVANTI</button>
                    `;
                }

                document.getElementById("victory-screen").style.display = "flex";
                updateUI();
            }, 500);
        }

        function loadLevel(num) {
            level = num;
            localStorage.setItem('mk_level', level);
            document.getElementById("victory-screen").style.display = "none";
            document.getElementById("level-menu").style.display = "none";
            generateHardLevel(num);
            resetTimer(); startTimer(); render(); updateUI();
        }

        function startTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                let m = Math.floor(seconds/60).toString().padStart(2,'0'), s = (seconds%60).toString().padStart(2,'0');
                document.getElementById("timer").innerText = `${m}:${s}`;
            }, 1000);
        }

        function resetTimer() { clearInterval(timerInterval); seconds = 0; document.getElementById("timer").innerText = "00:00"; }
        function updateUI() { 
            document.getElementById("xp").innerText = xp; 
            document.getElementById("level").innerText = level; 
            
            const skipBtn = document.getElementById("direct-skip-btn");
            if (skipBtn) {
                let isWorldEndLevel = (level % 100 === 0 || level >= 10000);
                let currencyIcon = worldConfig[getCurrentWorld(level)]?.cur || '💎';
                if (isWorldEndLevel) {
                    skipBtn.innerText = "SKIP BLOCCATO";
                    skipBtn.disabled = true;
                    skipBtn.style.opacity = "0.4";
                } else {
                    skipBtn.innerText = `SKIP (${skipCost} ${currencyIcon})`;
                    skipBtn.disabled = false;
                    skipBtn.style.opacity = "1";
                }
            }
        }

        function resetLevel() { blocks = JSON.parse(JSON.stringify(initialPos)); render(); resetTimer(); startTimer(); }
        function nextLevel() { loadLevel(level + 1); }

        function buildWorldTabs() {
            const container = document.getElementById("world-tabs-container");
            if (!container) return;
            container.innerHTML = '';
            for (let w = 1; w <= 100; w++) {
                const btn = document.createElement("button");
                let worldLocked = (w > 1 && !isWorldCompleted(w - 1));
                btn.className = `tab-btn ${w === activeTabWorld ? 'active' : ''} ${worldLocked ? 'locked' : ''}`;
                btn.innerText = `M. ${w} ${worldLocked ? '🔒' : ''}`;
                btn.onclick = () => {
                    if (worldLocked) {
                        showPopup(`Completa tutti i livelli del Mondo ${w - 1} per sbloccare il Mondo ${w}!`);
                        return;
                    }
                    switchWorldTab(w);
                };
                container.appendChild(btn);
            }
        }

        function switchWorldTab(wNum) {
            activeTabWorld = wNum;
            buildWorldTabs();
            renderLevelGrid();
        }

        function toggleMenu() {
            const m = document.getElementById("level-menu");
            const v = document.getElementById("victory-screen");
            if (v) v.style.display = 'none';

            const isOpening = m.style.display !== "flex";
            m.style.display = isOpening ? "flex" : "none";
            if (isOpening) {
                switchWorldTab(getCurrentWorld(level));
            }
        }

        function renderLevelGrid() {
            const g = document.getElementById("level-grid");
            g.innerHTML = '';
            let startLvl = (activeTabWorld - 1) * 100 + 1;
            let endLvl = activeTabWorld * 100;

            for (let i = startLvl; i <= endLvl; i++) {
                const btn = document.createElement("div");
                let locked = i > level;
                let isCompleted = rewardedLevels.includes(i) || i < level;
                btn.className = `lvl-btn ${locked ? 'locked' : (isCompleted ? 'completed' : '')}`;
                btn.innerHTML = locked ? '🔒' : i;
                if (!locked) btn.onclick = () => loadLevel(i);
                g.appendChild(btn);
            }
        }

        function buySkipItem() {
            let isWorldEndLevel = (level % 100 === 0 || level >= 10000);
            if (isWorldEndLevel) {
                showPopup("⛔ Lo Skip è disattivato sull'ultimo livello del mondo!");
                return;
            }

            if (xp >= skipCost) {
                xp -= skipCost;
                skipCost += 100;
                localStorage.setItem('mk_skip_cost', skipCost);

                if (!rewardedLevels.includes(level)) {
                    rewardedLevels.push(level);
                    localStorage.setItem('mk_rewarded', JSON.stringify(rewardedLevels));
                }

                level++;
                localStorage.setItem('mk_level', level);
                syncAndUnlockPreviousWorlds();
                showPopup("Livello saltato!");
                savePoints(xp);
                nextLevel();
            } else {
                showPopup("Risorse insufficienti per lo skip!");
            }
        }
    </script>
</body>
