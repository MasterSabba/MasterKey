<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Key - Multiverse Edition</title>
    <style>
        :root {
            --bg: #0f1710;
            --wood: #b8860b;
            --wood-dark: #2a1a08;
            --gold: #ffd700;
            --board-border: #8b5a2b;
            --board-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(139, 90, 43, 0.4);
            --particle-color: rgba(255, 215, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            color: #f0e6d2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            transition: background 0.8s ease;
            position: relative;
        }

        /* SFONDI IMMERSIVI PER MONDI (BASE) */
        body.world-1 {
            --bg: #0b140d;
            --wood: #a07246;
            --wood-dark: #2c1a0e;
            --gold: #f3c623;
            --board-border: #5c3a21;
            --board-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 25px rgba(46, 125, 50, 0.3);
            --particle-color: rgba(180, 240, 100, 0.7);
            background: radial-gradient(circle at 50% 30%, #1e3822 0%, #0d1e11 50%, #050b06 100%);
        }

        body.world-2 {
            --bg: #030814;
            --wood: #00d4ff;
            --wood-dark: #021329;
            --gold: #00ffcc;
            --board-border: #00d4ff;
            --board-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 30px rgba(0, 212, 255, 0.5);
            --particle-color: rgba(0, 255, 204, 0.8);
            background: radial-gradient(circle at 50% 40%, #08214d 0%, #030d24 60%, #01040a 100%);
        }

        body.world-3 {
            --bg: #140302;
            --wood: #ff4500;
            --wood-dark: #2b0602;
            --gold: #ffcc00;
            --board-border: #ff3300;
            --board-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 30px rgba(255, 69, 0, 0.6);
            --particle-color: rgba(255, 120, 0, 0.85);
            background: radial-gradient(circle at 50% 70%, #4a0d05 0%, #210402 50%, #0a0101 100%);
        }

        /* OVERRIDE DELLE SKIN SUI COLORI DEGLI ELEMENTI */
        body.skin-neon { --wood: #00d4ff; --wood-dark: #001a33; --gold: #00ffcc; --board-border: #00d4ff; --board-shadow: 0 0 25px #00d4ff; }
        body.skin-royal { --wood: #9b30ff; --wood-dark: #330033; --gold: #ffd700; --board-border: #9b30ff; --board-shadow: 0 0 25px #9b30ff; }
        body.skin-gold { --wood: #d4af37; --wood-dark: #3a2e00; --gold: #ffffff; --board-border: #ffd700; --board-shadow: 0 0 25px #ffd700; }
        body.skin-lava { --wood: #ff4500; --wood-dark: #330000; --gold: #ffcc00; --board-border: #ff4500; --board-shadow: 0 0 25px #ff4500; }
        body.skin-aqua { --wood: #00ffff; --wood-dark: #003333; --gold: #7fffd4; --board-border: #00ffff; --board-shadow: 0 0 25px #00ffff; }

        /* VETTORE GRAFICO DI SFONDO DINAMICO */
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            transition: opacity 0.8s ease;
            opacity: 0;
        }

        body[class*="world-1"] #bg-forest,
        body[class*="world-2"] #bg-neon,
        body[class*="world-3"] #bg-volcano {
            opacity: 1;
        }

        /* ELEMENTI DELLA FORESTA */
        .trees-svg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45vh;
            fill: #061008;
            opacity: 0.85;
        }

        /* PARTICELLE DINAMICHE / BRACI / LUCCIOLE */
        canvas#particles-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* GRID CYBERPUNK MONDO 2 */
        .cyber-grid {
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background-image: 
                linear-gradient(to right, rgba(0, 212, 255, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 212, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
        }

        /* VOLCANO GLOW MONDO 3 */
        .lava-glow {
            position: absolute;
            bottom: -100px; left: 50%;
            transform: translateX(-50%);
            width: 120vw; height: 350px;
            background: radial-gradient(ellipse at center, rgba(255, 69, 0, 0.4) 0%, rgba(255, 0, 0, 0.15) 50%, transparent 80%);
            animation: lavaPulse 4s ease-in-out infinite alternate;
        }

        @keyframes lavaPulse {
            0% { opacity: 0.6; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        .exit-button {
            position: absolute; top: 15px; left: 20px; font-size: 2rem; line-height: 1;
            color: rgba(255, 255, 255, 0.6); text-decoration: none; z-index: 100;
            transition: all 0.2s ease; font-family: Arial, sans-serif;
            cursor: pointer;
        }
        .exit-button:hover { color: var(--gold); transform: scale(1.1); }

        #game-ui { 
            position: relative; 
            z-index: 10; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 12px;
            backdrop-filter: blur(5px);
            padding: 15px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .header { 
            display: flex; 
            gap: 20px; 
            background: var(--wood-dark); 
            padding: 10px 22px; 
            border-radius: 15px; 
            border: 2px solid var(--wood); 
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .stat-item { font-weight: bold; color: var(--gold); font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
        .btn-menu-top { 
            background: var(--gold); 
            color: #000;
            border: none; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            padding: 7px 14px;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-menu-top:hover { transform: scale(1.05); }

        .world-badge {
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 4px 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-weight: bold;
            text-transform: uppercase;
        }

        .level-tag { color: var(--gold); font-weight: bold; font-size: 1.3rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        .board-frame { 
            padding: 14px; 
            background: var(--wood-dark); 
            border-radius: 18px; 
            border: 4px solid var(--board-border); 
            box-shadow: var(--board-shadow); 
            transition: all 0.3s ease;
            position: relative;
        }

        .grid { 
            width: 300px; 
            height: 300px; 
            position: relative; 
            background: rgba(0, 0, 0, 0.85); 
            border-radius: 10px; 
            overflow: visible;
        }

        /* PORTA DI USCITA RIGIDA E DEFINITA */
        .grid::after {
            content: ''; position: absolute; right: -18px; top: 100px; width: 20px; height: 50px; 
            background: var(--gold); border-radius: 0 8px 8px 0; box-shadow: 0 0 15px var(--gold); z-index: 5;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .block {
            position: absolute; border-radius: 8px; box-sizing: border-box; border: 2px solid rgba(0,0,0,0.4);
            background: var(--wood); cursor: grab; box-shadow: inset 0 0 12px rgba(255,255,255,0.25), 0 4px 8px rgba(0,0,0,0.5);
            touch-action: none;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .block-key { 
            background: var(--gold) !important; 
            z-index: 10; 
            border-color: #fff;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 0 12px var(--gold);
        }
        .block-obstacle { 
            background: #222 !important; 
            border-color: #ff3300 !important; 
            cursor: not-allowed; 
            box-shadow: inset 0 0 10px #ff0000; 
        }

        .footer-controls { display: flex; gap: 10px; margin-top: 5px; }

        .btn-wood {
            padding: 12px 22px; background: var(--wood-dark); color: white; border: 1px solid var(--wood);
            border-radius: 10px; font-weight: bold; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn-wood:hover { transform: translateY(-2px); }
        .btn-wood.gold { background: var(--gold); color: #000; }
        .btn-wood.skin { background: #000; color: var(--gold); border: 1px solid var(--gold); }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; }
        .modal { background: var(--wood-dark); padding: 25px; border-radius: 20px; border: 3px solid var(--wood); text-align: center; width: 88%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: all 0.3s ease; }

        .world-tabs { display: flex; gap: 6px; margin-bottom: 15px; justify-content: center; }
        .tab-btn { padding: 8px 12px; background: #000; color: #aaa; border: 1px solid var(--wood); border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }

        .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0; max-height: 240px; overflow-y: auto; padding: 5px; }
        .lvl-btn { aspect-ratio: 1; background: rgba(0,0,0,0.6); color: var(--gold); border: 2px solid var(--wood); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .lvl-btn.locked { opacity: 0.3; cursor: not-allowed; }
        .lvl-btn.completed { border-color: var(--gold); background: rgba(255, 215, 0, 0.2); }

        .skin-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 260px; overflow-y: auto; }
        .skin-item { padding: 12px; border: 2px solid var(--wood); background: rgba(0,0,0,0.5); color: white; border-radius: 10px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body class="world-1">

    <a href="#" onclick="window.close(); return false;" class="exit-button" title="Torna all'Hub">×</a>

    <!-- SFONDI SPECIFICI DEI MONDI -->
    <div id="bg-forest" class="bg-layer">
        <svg class="trees-svg" viewBox="0 0 1200 400" preserveAspectRatio="none">
            <path d="M0,400 L0,280 L30,220 L60,280 L90,200 L120,280 L150,180 L180,280 L210,230 L240,280 L270,190 L300,280 L330,210 L360,280 L390,160 L420,280 L450,220 L480,280 L510,190 L540,280 L570,240 L600,280 L630,170 L660,280 L690,220 L720,280 L750,200 L780,280 L810,150 L840,280 L870,210 L900,280 L930,230 L960,280 L990,180 L1020,280 L1050,220 L1080,280 L1110,190 L1140,280 L1170,230 L1200,280 L1200,400 Z" fill="#08180c"/>
            <path d="M0,400 L0,320 L40,260 L80,320 L120,240 L160,320 L200,270 L240,320 L280,220 L320,320 L360,270 L400,320 L440,230 L480,320 L520,280 L560,320 L600,210 L640,320 L680,260 L720,320 L760,240 L800,320 L840,200 L880,320 L920,270 L960,320 L1000,230 L1040,320 L1080,270 L1120,320 L1160,250 L1200,320 L1200,400 Z" fill="#040a05"/>
        </svg>
    </div>

    <div id="bg-neon" class="bg-layer">
        <div class="cyber-grid"></div>
    </div>

    <div id="bg-volcano" class="bg-layer">
        <div class="lava-glow"></div>
    </div>

    <!-- CANVAS PER PARTICELLE (LUCCIOLE / NEON / BRACI) -->
    <canvas id="particles-canvas"></canvas>
    
    <div id="game-ui">
        <div class="header">
            <div class="stat-item">⏳ <span id="timer">00:00</span></div>
            <div class="stat-item"><span id="currency-icon">🪵</span> <span id="xp">0</span></div>
            <button class="btn-menu-top" onclick="toggleMenu()">MENU</button>
        </div>

        <div class="world-badge" id="world-title">MONDO 1: FORESTA DI LEGNO</div>
        <div class="level-tag">LIVELLO <span id="level">1</span></div>

        <div class="board-frame">
            <div id="grid" class="grid"></div>
        </div>

        <div class="footer-controls">
            <button class="btn-wood" onclick="resetLevel()">RESET</button>
            <button id="skin-shop-btn" class="btn-wood skin" onclick="toggleSkinShop()">SKIN SHOP</button>
        </div>
    </div>

    <!-- MENU LIVELLI -->
    <div id="level-menu" class="overlay">
        <div class="modal">
            <h2>LIVELLI</h2>
            <div class="world-tabs">
                <button class="tab-btn active" id="tab-w1" onclick="switchWorldTab(1)">Mondo 1</button>
                <button class="tab-btn" id="tab-w2" onclick="switchWorldTab(2)">Mondo 2</button>
                <button class="tab-btn" id="tab-w3" onclick="switchWorldTab(3)">Mondo 3</button>
            </div>
            <div id="level-grid" class="level-grid"></div>
            <button class="btn-wood" onclick="toggleMenu()">CHIUDI</button>
        </div>
    </div>

    <!-- SKIN SHOP -->
    <div id="skin-shop" class="overlay">
        <div class="modal">
            <h2>CAMBIA SKIN</h2>
            <div id="skin-grid" class="skin-options"></div>
            <button class="btn-wood" onclick="toggleSkinShop()">CHIUDI</button>
        </div>
    </div>

    <!-- SCHERMATA VITTORIA -->
    <div id="victory-screen" class="overlay">
        <div class="modal victory">
            <h1 id="win-title">COMPLETATO!</h1>
            <p id="victory-xp-msg"></p>
            <div class="victory-btns">
                <button class="btn-wood" onclick="goToLevelsFromVictory()">LIVELLI</button>
                <button class="btn-wood gold" onclick="nextLevel()">AVANTI</button>
            </div>
        </div>
    </div>

    <script>
        const cellSize = 50;
        let blocks = [], initialPos = [], isDragging = false, timerInterval, seconds = 0;

        let level = parseInt(localStorage.getItem('mk_level')) || 1;
        let unlockedLevel = parseInt(localStorage.getItem('mk_unlocked')) || 1;

        let xp = parseInt(localStorage.getItem("points_masterkey")) || parseInt(localStorage.getItem('mk_xp')) || 0;
        localStorage.setItem('points_masterkey', xp);

        let rewardedLevels = JSON.parse(localStorage.getItem('mk_rewarded')) || [];
        let ownedSkins = JSON.parse(localStorage.getItem('mk_skins')) || ['default'];
        let currentSkin = localStorage.getItem('mk_currentSkin') || 'default';

        let userNick = localStorage.getItem('nickname') || localStorage.getItem('username') || localStorage.getItem('mk_nick') || "Player";
        let activeTabWorld = 1;

        const availableSkins = [
            { id: 'default', name: 'Classica Mondo', cost: 0 },
            { id: 'neon', name: 'Neon City (Glow)', cost: 500 },
            { id: 'royal', name: 'Royal Gold (Glow)', cost: 1500 },
            { id: 'lava', name: 'Magma (Glow)', cost: 2500 },
            { id: 'aqua', name: 'Oceano (Glow)', cost: 3000 }
        ];

        /* SISTEMA PARTICELLE DINAMICO */
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(world) {
                this.reset(world);
            }

            reset(world) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.world = world;

                if (world === 1) { // Lucciole
                    this.speedX = (Math.random() - 0.5) * 0.8;
                    this.speedY = (Math.random() - 0.5) * 0.8;
                    this.opacity = Math.random() * 0.7 + 0.2;
                    this.color = `rgba(${180 + Math.random()*50}, 255, ${100 + Math.random()*50}, ${this.opacity})`;
                } else if (world === 2) { // Particelle digitali
                    this.speedX = 0;
                    this.speedY = -(Math.random() * 1.5 + 0.5);
                    this.color = `rgba(0, 212, 255, ${Math.random() * 0.8 + 0.2})`;
                } else { // Braci del vulcano
                    this.speedX = (Math.random() - 0.5) * 1.5;
                    this.speedY = -(Math.random() * 2 + 1);
                    this.color = `rgba(255, ${Math.floor(Math.random()*120)}, 0, ${Math.random() * 0.9 + 0.1})`;
                }
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset(getCurrentWorld(level));
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 45; i++) {
                particles.push(new Particle(getCurrentWorld(level)));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        window.onload = () => {
            updateUI();
            loadLevel(level);
            setupSkinShop();
            initParticles();
            animateParticles();
        };

        function getCurrentWorld(lvl) {
            if (lvl <= 100) return 1;
            if (lvl <= 200) return 2;
            return 3;
        }

        function configureWorldSettings(worldNum) {
            const body = document.body;
            
            // Rimuovi tutte le classi skin e world precedenti
            body.className = '';

            // Applica sempre la classe del mondo corrente per mostrare lo sfondo appropriato
            body.classList.add('world-' + worldNum);

            // Se una skin diversa da 'default' è equipaggiata, aggiungi la classe skin corrispondente
            if (currentSkin && currentSkin !== 'default') {
                body.classList.add('skin-' + currentSkin);
            }

            const titleEl = document.getElementById("world-title");
            if (worldNum === 1) {
                titleEl.innerText = "MONDO 1: FORESTA DI LEGNO";
            } else if (worldNum === 2) {
                titleEl.innerText = "MONDO 2: CRIPTA NEON";
            } else {
                titleEl.innerText = "MONDO 3: VULCANO MAGMATICO";
            }

            const iconEl = document.getElementById("currency-icon");
            if (iconEl) {
                iconEl.innerText = (worldNum === 1) ? "🪵" : "💎";
            }

            initParticles();
        }

        async function savePoints(newXp) {
            xp = newXp;
            localStorage.setItem('points_masterkey', xp);
            localStorage.setItem('mk_xp', xp);
            updateUI();

            try {
                if (typeof db !== 'undefined') {
                    await db.collection("users").doc(userNick).set({ MasterKey: xp }, { merge: true });
                }
            } catch (e) {
                console.error("Errore salvataggio Cloud:", e);
            }
        }

        function triggerGameWin(pointsGained) {
            const target = window.opener || (window.parent !== window ? window.parent : null);
            if (target) {
                target.postMessage({ gameKey: 'master-key', points: pointsGained }, '*');
            }
        }

        function generateHardLevel(num) {
            const curWorld = getCurrentWorld(num);
            configureWorldSettings(curWorld);

            let solved = false;
            let attempts = 0;
            let seed = num * 1234.5;
            const rng = () => {
                seed = Math.sin(seed) * 10000;
                return seed - Math.floor(seed);
            };

            while (!solved && attempts < 80) {
                attempts++;
                blocks = [{ x: 0, y: 2, l: 2, o: 'h', k: true, obs: false }];

                if (curWorld === 3) {
                    let obsCount = 2;
                    for (let o = 0; o < obsCount; o++) {
                        let ox = Math.floor(rng() * 6);
                        let oy = Math.floor(rng() * 6);
                        if (oy !== 2 && !checkCollision(ox, oy, 1, 'h', -1)) {
                            blocks.push({ x: ox, y: oy, l: 1, o: 'h', k: false, obs: true });
                        }
                    }
                }

                let targetCount = 8 + Math.min(Math.floor((num % 100) / 4), 7);
                
                for (let i = 0; i < 200 && blocks.length < targetCount; i++) {
                    let l = rng() > 0.8 ? 3 : 2;
                    let o = rng() > 0.5 ? 'h' : 'v';
                    let x = Math.floor(rng() * (6 - (o === 'h' ? l : 1)));
                    let y = Math.floor(rng() * (6 - (o === 'v' ? l : 1)));
                    if (o === 'h' && y === 2) continue; 
                    if (!checkCollision(x, y, l, o, -1)) blocks.push({ x, y, l, o, k: false, obs: false });
                }
                if (isSolvable(JSON.parse(JSON.stringify(blocks)))) solved = true;
                else seed += 1;
            }
            initialPos = JSON.parse(JSON.stringify(blocks));
        }

        function isSolvable(startBlocks) {
            let queue = [JSON.stringify(startBlocks)];
            let visited = new Set([queue[0]]);
            let steps = 0;
            while (queue.length > 0 && steps < 1200) {
                steps++;
                let currentBlocks = JSON.parse(queue.shift());
                if (currentBlocks[0].x === 4) return true;
                for (let i = 0; i < currentBlocks.length; i++) {
                    let b = currentBlocks[i];
                    if (b.obs) continue;

                    let dirs = b.o === 'h' ? [[1,0], [-1,0]] : [[0,1], [0,-1]];
                    for (let d of dirs) {
                        let next = JSON.parse(JSON.stringify(currentBlocks));
                        let nb = next[i];
                        while (true) {
                            let nx = nb.x + d[0], ny = nb.y + d[1];
                            if (canMoveTo(nx, ny, nb.l, nb.o, i, next)) {
                                nb.x = nx; nb.y = ny;
                                let state = JSON.stringify(next);
                                if (!visited.has(state)) { visited.add(state); queue.push(state); }
                            } else break;
                        }
                    }
                }
            }
            return false;
        }

        function canMoveTo(x, y, l, o, idx, currentBlocks) {
            const w = o === 'h' ? l : 1, h = o === 'v' ? l : 1;
            if (x < 0 || x + w > 6 || y < 0 || y + h > 6) return false;
            return !currentBlocks.some((b, i) => {
                if (i === idx) return false;
                const bw = b.o === 'h' ? b.l : 1, bh = b.o === 'v' ? b.l : 1;
                return x < b.x + bw && x + w > b.x && y < b.y + bh && y + h > b.y;
            });
        }

        function switchWorldTab(wNum) {
            activeTabWorld = wNum;
            document.querySelectorAll('.tab-btn').forEach((b, idx) => {
                b.classList.toggle('active', idx + 1 === wNum);
            });
            renderLevelGrid();
        }

        function renderLevelGrid() {
            const g = document.getElementById("level-grid");
            g.innerHTML = '';
            
            let startLvl = (activeTabWorld - 1) * 100 + 1;
            let endLvl = activeTabWorld * 100;

            for (let i = startLvl; i <= endLvl; i++) {
                const btn = document.createElement("div");
                let locked = i > unlockedLevel;
                btn.className = `lvl-btn ${locked ? 'locked' : (rewardedLevels.includes(i) ? 'completed' : '')}`;
                btn.innerHTML = locked ? '🔒' : i;
                if (!locked) btn.onclick = () => loadLevel(i);
                g.appendChild(btn);
            }
        }

        function toggleMenu() {
            const m = document.getElementById("level-menu");
            const s = document.getElementById("skin-shop");
            const v = document.getElementById("victory-screen");
            
            if (s) s.style.display = 'none';
            if (v) v.style.display = 'none';

            const isOpening = m.style.display !== "flex";
            m.style.display = isOpening ? "flex" : "none";
            
            if (isOpening) {
                switchWorldTab(getCurrentWorld(level));
            }
        }

        function goToLevelsFromVictory() { toggleMenu(); }

        function setupSkinShop() {
            const shopGrid = document.getElementById("skin-grid");
            if (!shopGrid) return;
            shopGrid.innerHTML = '';
            const currencyIcon = getCurrentWorld(level) === 1 ? '🪵' : '💎';

            availableSkins.forEach(skin => {
                const item = document.createElement("div");
                item.className = "skin-item";
                
                const isOwned = ownedSkins.includes(skin.id);
                const isEquipped = currentSkin === skin.id;

                let buttonLabel = '';
                if (isEquipped) {
                    buttonLabel = 'USATA';
                } else if (isOwned) {
                    buttonLabel = 'USA';
                } else {
                    buttonLabel = skin.cost + ' ' + currencyIcon;
                }

                item.innerHTML = `
                    <span>${skin.name}</span>
                    <button class="btn-wood ${isEquipped ? 'gold' : ''}" style="margin:0; padding: 6px 12px;" onclick="buySkin('${skin.id}', ${skin.cost})">
                        ${buttonLabel}
                    </button>
                `;
                shopGrid.appendChild(item);
            });
        }

        function toggleSkinShop() {
            const s = document.getElementById('skin-shop');
            const m = document.getElementById('level-menu');
            if (m) m.style.display = 'none';
            
            const isOpening = s.style.display !== 'flex';
            s.style.display = isOpening ? 'flex' : 'none';
            if (isOpening) setupSkinShop();
        }

        function buySkin(id, cost) {
            if (ownedSkins.includes(id)) {
                applySkin(id);
                setupSkinShop();
                return;
            }
            if (xp >= cost) {
                let newXp = xp - cost;
                ownedSkins.push(id);
                localStorage.setItem('mk_skins', JSON.stringify(ownedSkins));
                applySkin(id);
                savePoints(newXp);
                setupSkinShop();
            } else {
                alert("Punti insufficienti!");
            }
        }

        function applySkin(id) {
            currentSkin = id;
            localStorage.setItem('mk_currentSkin', id);
            configureWorldSettings(getCurrentWorld(level));
            render();
        }

        function loadLevel(num) {
            level = num;
            localStorage.setItem('mk_level', level);
            document.getElementById("victory-screen").style.display = "none";
            document.getElementById("level-menu").style.display = "none";
            generateHardLevel(num);
            resetTimer(); startTimer(); render(); updateUI();
        }

        function render() {
            const grid = document.getElementById("grid");
            grid.innerHTML = '';
            blocks.forEach((b, i) => {
                const div = document.createElement("div");
                div.className = `block ${b.k ? 'block-key' : ''} ${b.obs ? 'block-obstacle' : ''}`;
                div.style.width = (b.o === 'h' ? b.l * cellSize : cellSize) - 4 + "px";
                div.style.height = (b.o === 'v' ? b.l * cellSize : cellSize) - 4 + "px";
                div.style.left = (b.x * cellSize + 2) + "px";
                div.style.top = (b.y * cellSize + 2) + "px";

                if (b.obs) {
                    div.innerHTML = "<span style='display:flex;justify-content:center;align-items:center;height:100%;font-size:16px;'>🔥</span>";
                    grid.appendChild(div);
                    return;
                }

                div.onpointerdown = (e) => {
                    if (isDragging) return;
                    isDragging = true;
                    div.setPointerCapture(e.pointerId);
                    let startX = e.clientX, startY = e.clientY, ox = b.x, oy = b.y;

                    div.onpointermove = (em) => {
                        let dx = Math.round((em.clientX - startX) / cellSize);
                        let dy = Math.round((em.clientY - startY) / cellSize);
                        let target = (b.o === 'h' ? ox + dx : oy + dy);
                        let current = (b.o === 'h' ? b.x : b.y);

                        while (current !== target) {
                            let step = target > current ? 1 : -1;
                            let nx = b.x + (b.o === 'h' ? step : 0), ny = b.y + (b.o === 'v' ? step : 0);
                            if (!checkCollision(nx, ny, b.l, b.o, i)) {
                                b.x = nx; b.y = ny; current += step;
                            } else break;
                        }
                        div.style.left = (b.x * cellSize + 2) + "px";
                        div.style.top = (b.y * cellSize + 2) + "px";
                    };
                    div.onpointerup = () => {
                        isDragging = false; div.onpointermove = null;
                        if (b.k && b.x === 4) handleWin();
                    };
                };
                grid.appendChild(div);
            });
        }

        function checkCollision(x, y, l, o, idx) {
            const w = o === 'h' ? l : 1, h = o === 'v' ? l : 1;
            if (x < 0 || x + w > 6 || y < 0 || y + h > 6) return true;
            return blocks.some((b, i) => {
                if (i === idx) return false;
                const bw = b.o === 'h' ? b.l : 1, bh = b.o === 'v' ? b.l : 1;
                return x < b.x + bw && x + w > b.x && y < b.y + bh && y + h > b.y;
            });
        }

        function handleWin() {
            clearInterval(timerInterval);
            const key = document.querySelector('.block-key');
            if (key) {
                key.style.transition = "left 0.5s ease-in"; key.style.left = "350px";
            }
            setTimeout(() => {
                let msg = "GIÀ FATTO";
                let curWorld = getCurrentWorld(level);
                let currencySymbol = curWorld === 1 ? '🪵' : '💎';

                if (!rewardedLevels.includes(level)) {
                    let newXp = xp + 100;
                    rewardedLevels.push(level);
                    localStorage.setItem('mk_rewarded', JSON.stringify(rewardedLevels));
                    savePoints(newXp);
                    triggerGameWin(100);
                    msg = `+100 ${currencySymbol}`;
                }

                if (level === unlockedLevel) { unlockedLevel++; localStorage.setItem('mk_unlocked', unlockedLevel); }

                if (level === 100) {
                    document.getElementById("win-title").innerText = "MONDO 1 SUPERATO! 🎉";
                    msg += "<br>Sbloccato Mondo 2: Cripta Neon!";
                } else if (level === 200) {
                    document.getElementById("win-title").innerText = "MONDO 2 SUPERATO! 🔥";
                    msg += "<br>Sbloccato Mondo 3: Vulcano Magmatico!";
                } else {
                    document.getElementById("win-title").innerText = "COMPLETATO!";
                }

                document.getElementById("victory-xp-msg").innerHTML = msg;
                document.getElementById("victory-screen").style.display = "flex";
                updateUI();
            }, 500);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                let m = Math.floor(seconds/60).toString().padStart(2,'0'), s = (seconds%60).toString().padStart(2,'0');
                document.getElementById("timer").innerText = `${m}:${s}`;
            }, 1000);
        }

        function resetTimer() { clearInterval(timerInterval); seconds = 0; document.getElementById("timer").innerText = "00:00"; }
        function updateUI() { 
            document.getElementById("xp").innerText = xp; 
            document.getElementById("level").innerText = level; 
        }
        function resetLevel() { blocks = JSON.parse(JSON.stringify(initialPos)); render(); resetTimer(); startTimer(); }
        function nextLevel() { loadLevel(level + 1); }
    </script>
</body>
</html>
